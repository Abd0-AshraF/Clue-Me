// Auto-resolving capacitor project settings for both NPM and Bun environments
def resolvePluginDir(String pkgName, String subDir) {
    File npmDir = new File(rootDir, "../node_modules/${pkgName}/${subDir}")
    if (npmDir.exists()) {
        return npmDir
    }
    File bunDir = fileTree(dir: new File(rootDir, '../node_modules/.bun'), include: "**/node_modules/${pkgName}/${subDir}").files.find { true }
    if (bunDir != null) {
        return bunDir
    }
    return npmDir
}

include ':capacitor-android'
project(':capacitor-android').projectDir = resolvePluginDir('@capacitor/android', 'capacitor')

include ':capacitor-app'
project(':capacitor-app').projectDir = resolvePluginDir('@capacitor/app', 'android')

include ':capacitor-haptics'
project(':capacitor-haptics').projectDir = resolvePluginDir('@capacitor/haptics', 'android')

include ':capacitor-screen-orientation'
project(':capacitor-screen-orientation').projectDir = resolvePluginDir('@capacitor/screen-orientation', 'android')

include ':capacitor-status-bar'
project(':capacitor-status-bar').projectDir = resolvePluginDir('@capacitor/status-bar', 'android')
