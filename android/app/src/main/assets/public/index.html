    <!-- Apply stored language/direction/theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var qs = new URLSearchParams(location.search);
          if (qs.has('frame_id') || qs.has('instance_id') || qs.get('activity') === 'mock') {
            document.documentElement.classList.add('cm-discord-activity');
          }
          var lang = localStorage.getItem('clue-me:lang');
          if (lang !== 'ar' && lang !== 'en') lang = 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          var theme = localStorage.getItem('clue-me:theme') || 'mot';
          var dark =
            theme === 'dark' ||
            theme === 'mani-dark' ||
            theme === 'mot' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var mani = theme === 'mani' || theme === 'mani-dark';
          var mot = theme === 'mot';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('mani', mani);
          document.documentElement.classList.toggle('mani-dark', theme === 'mani-dark');
          document.documentElement.classList.toggle('mot', mot);
        } catch (e) {
          /* storage unavailable — keep static defaults */
        }
      })();
    </script>
    
    <!-- CLUE ME NATIVE APP AUTO-CONNECT BRIDGE -->
    <script>
      (function() {
        var SERVERS = [
          "https://ais-pre-frb66bk6gdpkcntddasbba-520664284111.europe-west3.run.app",
          "https://ais-dev-frb66bk6gdpkcntddasbba-520664284111.europe-west3.run.app",
          "https://clue-me.ai.studio"
        ];
        
        var isNativeApp = (
          window.Capacitor !== undefined ||
          location.protocol === "capacitor:" ||
          location.protocol === "file:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1" ||
          location.origin.indexOf("localhost") !== -1
        );
        
        var customServer = "";
        try { customServer = localStorage.getItem("clue_me_custom_server") || ""; } catch(e){}
        
        var activeServer = (customServer || (isNativeApp ? SERVERS[0] : "")).replace(/\/$/, "");
        window.__CLUE_ME_SERVER_URL__ = activeServer;

        // Auto-detect and failover if primary is unreachable
        function checkServerHealth(url, timeoutMs) {
          return new Promise(function(resolve) {
            var ctrl = new AbortController();
            var timer = setTimeout(function() { ctrl.abort(); resolve(false); }, timeoutMs || 3500);
            fetch(url + "/api/health", { signal: ctrl.signal })
              .then(function(r) { clearTimeout(timer); resolve(r.ok); })
              .catch(function() { clearTimeout(timer); resolve(false); });
          });
        }

        if (isNativeApp && !customServer) {
          // Probe servers in background and pick the fastest responding one
          checkServerHealth(SERVERS[0], 2500).then(function(ok) {
            if (!ok) {
              checkServerHealth(SERVERS[1], 2500).then(function(ok2) {
                if (ok2) {
                  activeServer = SERVERS[1];
                  window.__CLUE_ME_SERVER_URL__ = activeServer;
                  try { localStorage.setItem("clue_me_active_server", activeServer); } catch(e){}
                }
              });
            }
          });
        }

        if (activeServer) {
          // Intercept fetch calls for API and Socket.IO
          var origFetch = window.fetch;
          window.fetch = function(input, init) {
            if (typeof input === "string") {
              if (input.startsWith("/api/") || input.startsWith("/socket.io") || (input.startsWith("/") && input.length > 1 && !input.startsWith("/assets/") && !input.startsWith("/sounds/") && !input.endsWith(".png") && !input.endsWith(".svg") && !input.endsWith(".json"))) {
                input = (window.__CLUE_ME_SERVER_URL__ || activeServer) + input;
              }
            } else if (input && typeof input.url === "string") {
              if (input.url.startsWith("/api/") || input.url.startsWith("/socket.io")) {
                input = new Request((window.__CLUE_ME_SERVER_URL__ || activeServer) + input.url, input);
              }
            }
            return origFetch.call(this, input, init);
          };

          // Intercept XMLHttpRequest
          var origOpen = window.XMLHttpRequest.prototype.open;
          window.XMLHttpRequest.prototype.open = function(method, url, async, user, pass) {
            if (typeof url === "string" && (url.startsWith("/api/") || url.startsWith("/socket.io"))) {
              url = (window.__CLUE_ME_SERVER_URL__ || activeServer) + url;
            }
            return origOpen.call(this, method, url, async, user, pass);
          };
        }

        // Deep Link Handling for Room Links (clueme://room/{code} or https://clue-me.ai.studio/?room={code})
        function handleDeepLinkUrl(urlStr) {
          if (!urlStr) return;
          try {
            var urlObj = new URL(urlStr);
            var roomCode = urlObj.searchParams.get("room") || urlObj.searchParams.get("code");
            if (!roomCode && (urlObj.protocol === "clueme:" || urlObj.protocol === "web+clueme:")) {
              var pathname = urlObj.pathname.replace(/^\/\//, "");
              var parts = pathname.split("/").filter(Boolean);
              if (parts.length >= 2 && parts[0] === "room") roomCode = parts[1];
              else if (parts.length === 1) roomCode = parts[0];
            }
            if (roomCode) {
              var cleanCode = roomCode.toUpperCase().trim();
              if (window.history && window.history.replaceState) {
                var newUrl = window.location.pathname + "?room=" + cleanCode;
                window.history.replaceState(null, "", newUrl);
              }
              // Dispatch custom event for React applet
              window.dispatchEvent(new CustomEvent("clue-me:join-room", { detail: { code: cleanCode } }));
            }
          } catch(e) {}
        }

        // Initialize Native Device Features (Status Bar, Safe Areas, Deep Links)
        document.addEventListener("DOMContentLoaded", function() {
          try {
            if (window.Capacitor && window.Capacitor.Plugins) {
              var StatusBar = window.Capacitor.Plugins.StatusBar;
              if (StatusBar) {
                StatusBar.setOverlaysWebView({ overlay: false }).catch(function(){});
                StatusBar.setStyle({ style: "DARK" }).catch(function(){});
                StatusBar.setBackgroundColor({ color: "#17131a" }).catch(function(){});
              }

              var App = window.Capacitor.Plugins.App;
              if (App && typeof App.addListener === "function") {
                App.addListener("appUrlOpen", function(data) {
                  if (data && data.url) handleDeepLinkUrl(data.url);
                });
              }
            }
          } catch(e) {}
        });

        // Global Tactile Haptic Feedback Engine
        window.cmTriggerHaptic = function(style) {
          try {
            var hasCapacitorHaptics = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
            if (hasCapacitorHaptics) {
              var Haptics = window.Capacitor.Plugins.Haptics;
              if (style === "heavy") Haptics.impact({ style: "HEAVY" });
              else if (style === "medium") Haptics.impact({ style: "MEDIUM" });
              else if (style === "success" || style === "win") Haptics.notification({ type: "SUCCESS" });
              else if (style === "warning" || style === "error") Haptics.notification({ type: "WARNING" });
              else Haptics.impact({ style: "LIGHT" });
            } else if (navigator.vibrate) {
              if (style === "heavy") navigator.vibrate([40, 30, 80]);
              else if (style === "medium") navigator.vibrate(40);
              else if (style === "success" || style === "win") navigator.vibrate([30, 40, 60, 40, 90]);
              else if (style === "warning" || style === "error") navigator.vibrate([60, 40, 60]);
              else navigator.vibrate(15);
            }
          } catch(e) {}
        };

        // Attach tactile touch feedback to all interactive buttons, cards, and keys
        document.addEventListener("click", function(e) {
          var target = e.target && e.target.closest ? e.target.closest("button, a, [role=\"button\"], .cm-card, [tabindex=\"0\"]") : null;
          if (target) {
            window.cmTriggerHaptic("light");
          }
        }, { passive: true });

        // Network status listeners to restore connection seamlessly
        window.addEventListener("online", function() {
          if (window.__clueMeSocket && typeof window.__clueMeSocket.connect === "function") {
            window.__clueMeSocket.connect();
          }
        });
      })();
    </script>

        <input id="cm-server-url-input" type="text" placeholder="https://example.run.app" style="width:100%; box-sizing:border-box; padding:10px 14px; background:#130e16; border:1px solid #5a4663; border-radius:8px; color:#fff; font-size:14px; margin-bottom:14px; outline:none;" />
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button type="button" onclick="document.getElementById('cm-server-config-modal').style.display='none'" style="background:transparent; border:1px solid #555; color:#ccc; padding:8px 14px; border-radius:8px; cursor:pointer;">إلغاء</button>
          <button type="button" onclick="saveCustomServer()" style="background:#e11d48; border:none; color:#fff; font-weight:600; padding:8px 18px; border-radius:8px; cursor:pointer;">حفظ واتصال</button>
        </div>

    <script>
      function openServerConfig() {
        var modal = document.getElementById('cm-server-config-modal');
        var input = document.getElementById('cm-server-url-input');
        if (input) input.value = window.__CLUE_ME_SERVER_URL__ || localStorage.getItem('clue_me_custom_server') || '';
        if (modal) modal.style.display = 'flex';
      }
      function saveCustomServer() {
        var input = document.getElementById('cm-server-url-input');
        if (input && input.value.trim()) {
          var val = input.value.trim().replace(/\/$/, '');
          localStorage.setItem('clue_me_custom_server', val);
          window.__CLUE_ME_SERVER_URL__ = val;
          alert('تم حفظ السيرفر بنجاح! سيتم إعادة التحميل الآن.');
          location.reload();
        }
      }
      window.openServerConfig = openServerConfig;
    </script>
