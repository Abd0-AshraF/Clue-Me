    <script>
      (function () {
        try {
          var qs = new URLSearchParams(location.search);
          if (qs.has('frame_id') || qs.has('instance_id') || qs.get('activity') === 'mock') {
            document.documentElement.classList.add('cm-discord-activity');
          }
          var lang = localStorage.getItem('clue-me:lang');
          if (lang !== 'ar' && lang !== 'en') lang = 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          var theme = localStorage.getItem('clue-me:theme') || 'mot';
          var dark =
            theme === 'dark' ||
            theme === 'mani-dark' ||
            theme === 'mot' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var mani = theme === 'mani' || theme === 'mani-dark';
          var mot = theme === 'mot';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('mani', mani);
          document.documentElement.classList.toggle('mani-dark', theme === 'mani-dark');
          document.documentElement.classList.toggle('mot', mot);
        } catch (e) {
          /* storage unavailable — keep static defaults */
        }
      })();

    <!-- CLUE ME NATIVE ANDROID AND WEB AUTO-CONNECT BRIDGE -->
    <script>
      (function() {
        var DEFAULT_SERVER = "https://clue-me.ai.studio";
        
        var isNativeApp = (
          window.Capacitor !== undefined ||
          location.protocol === "capacitor:" ||
          location.protocol === "file:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1" ||
          location.origin.indexOf("localhost") !== -1
        );

        if (isNativeApp) {
          document.documentElement.classList.add('cm-native-app');
          document.body && document.body.classList.add('cm-native-app');
        }

        var customServer = "";
        try { 
          var saved = localStorage.getItem("clue_me_custom_server") || localStorage.getItem("clue_me_active_server") || "";
          // Clear legacy expired preview URLs
          if (saved && (saved.indexOf("ais-pre-") !== -1 || saved.indexOf("ais-dev-") !== -1)) {
            localStorage.removeItem("clue_me_custom_server");
            localStorage.removeItem("clue_me_active_server");
            saved = "";
          }
          customServer = saved;
        } catch(e){}
        
        var activeServer = (customServer || DEFAULT_SERVER).replace(/\/$/, "");
        window.__CLUE_ME_SERVER_URL__ = activeServer;

        // Intercept fetch calls for API and Socket.IO
        var origFetch = window.fetch;
        window.fetch = function(input, init) {
          var prefix = window.__CLUE_ME_SERVER_URL__ || activeServer;
          if (typeof input === "string") {
            if (input.startsWith("/api/") || input.startsWith("/socket.io")) {
              input = prefix + input;
            } else if (input.startsWith("/") && !input.startsWith("/assets/") && !input.startsWith("/sounds/") && !input.endsWith(".png") && !input.endsWith(".svg") && !input.endsWith(".json") && !input.endsWith(".js") && !input.endsWith(".css") && !input.endsWith(".html")) {
              input = prefix + input;
            }
          } else if (input && typeof input.url === "string") {
            if (input.url.startsWith("/api/") || input.url.startsWith("/socket.io")) {
              input = new Request(prefix + input.url, input);
            }
          }
          return origFetch.call(this, input, init);
        };

        // Intercept XMLHttpRequest
        var origOpen = window.XMLHttpRequest.prototype.open;
        window.XMLHttpRequest.prototype.open = function(method, url, async, user, pass) {
          var prefix = window.__CLUE_ME_SERVER_URL__ || activeServer;
          if (typeof url === "string" && (url.startsWith("/api/") || url.startsWith("/socket.io"))) {
            url = prefix + url;
          }
          return origOpen.call(this, method, url, async, user, pass);
        };

        // Deep Link Handling for Room Links
        function handleDeepLinkUrl(urlStr) {
          if (!urlStr) return;
          try {
            var urlObj = new URL(urlStr);
            var pathname = urlObj.pathname.toLowerCase();
            
            // Ignore OAuth callbacks explicitly so Discord login works
            if (pathname.includes('auth') || pathname.includes('oauth') || pathname.includes('discord') || pathname.includes('callback') || pathname.includes('login')) {
              return;
            }

            var roomCode = urlObj.searchParams.get("room");
            if (!roomCode) {
               var code = urlObj.searchParams.get("code");
               // Room codes are short, OAuth codes are long
               if (code && code.length <= 12) roomCode = code;
            }

            if (!roomCode && (urlObj.protocol === "clueme:" || urlObj.protocol === "web+clueme:")) {
              var p = urlObj.pathname.replace(/^\/\//, "");
              var parts = p.split("/").filter(Boolean);
              if (parts.length >= 2 && parts[0] === "room") roomCode = parts[1];
              else if (parts.length === 1) roomCode = parts[0];
            }
            if (roomCode && roomCode.length <= 12) {
              var cleanCode = roomCode.toUpperCase().trim();
              if (window.history && window.history.replaceState) {
                var newUrl = window.location.pathname + "?room=" + cleanCode;
                window.history.replaceState(null, "", newUrl);
              }
              window.dispatchEvent(new CustomEvent("clue-me:join-room", { detail: { code: cleanCode } }));
            }
          } catch(e) {}
        }

        // Initialize Native Device Features
        document.addEventListener("DOMContentLoaded", function() {
          if (isNativeApp) {
            document.documentElement.classList.add('cm-native-app');
            document.body && document.body.classList.add('cm-native-app');
          }
          try {
            if (window.Capacitor && window.Capacitor.Plugins) {
              var StatusBar = window.Capacitor.Plugins.StatusBar;
              if (StatusBar) {
                StatusBar.setOverlaysWebView({ overlay: true }).catch(function(){});
                StatusBar.setStyle({ style: "DARK" }).catch(function(){});
                StatusBar.setBackgroundColor({ color: "#00000000" }).catch(function(){});
              }

              var App = window.Capacitor.Plugins.App;
              if (App && typeof App.addListener === "function") {
                App.addListener("appUrlOpen", function(data) {
                  if (data && data.url) handleDeepLinkUrl(data.url);
                });
              }
            }
          } catch(e) {}
        });

        // Global Tactile Haptic Feedback Engine for Android
        window.cmTriggerHaptic = function(style) {
          try {
            var hasCapacitorHaptics = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
            if (hasCapacitorHaptics) {
              var Haptics = window.Capacitor.Plugins.Haptics;
              if (style === "heavy") Haptics.impact({ style: "HEAVY" });
              else if (style === "medium") Haptics.impact({ style: "MEDIUM" });
              else if (style === "success" || style === "win") Haptics.notification({ type: "SUCCESS" });
              else if (style === "warning" || style === "error") Haptics.notification({ type: "WARNING" });
              else Haptics.impact({ style: "LIGHT" });
            } else if (navigator.vibrate) {
              if (style === "heavy") navigator.vibrate([40, 30, 80]);
              else if (style === "medium") navigator.vibrate(40);
              else if (style === "success" || style === "win") navigator.vibrate([30, 40, 60, 40, 90]);
              else if (style === "warning" || style === "error") navigator.vibrate([60, 40, 60]);
              else navigator.vibrate(15);
            }
          } catch(e) {}
        };

        // Attach tactile touch feedback to interactive elements
        document.addEventListener("click", function(e) {
          var target = e.target && e.target.closest ? e.target.closest('button, a, [role="button"], .cm-card, [tabindex="0"]') : null;
          if (target) {
            window.cmTriggerHaptic("light");
            
            // Check if user clicked on server offline badge to configure server
            var text = (target.innerText || "").toLowerCase();
            if (text.includes("server") || text.includes("offline") || text.includes("خادم") || text.includes("سيرفر")) {
              if (typeof window.openServerConfig === "function") {
                window.openServerConfig();
              }
            }
          }
        }, { passive: true });

        // Network status listeners to restore connection seamlessly
        window.addEventListener("online", function() {
          if (window.__clueMeSocket && typeof window.__clueMeSocket.connect === "function") {
            window.__clueMeSocket.connect();
          }
        });
      })();
    </script>
