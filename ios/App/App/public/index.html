    <script>
      (function() {
        function installStoragePolyfill(prop) {
          var mem = {};
          var polyfill = {
            getItem: function(k) { return mem[k] !== undefined ? mem[k] : null; },
            setItem: function(k, v) { mem[k] = String(v); },
            removeItem: function(k) { delete mem[k]; },
            clear: function() { mem = {}; },
            key: function(i) { return Object.keys(mem)[i] || null; },
            get length() { return Object.keys(mem).length; }
          };
          try {
            Object.defineProperty(window, prop, {
              value: polyfill,
              configurable: true,
              writable: true
            });
          } catch(e) {}
          try {
            if (window.Window && window.Window.prototype) {
              Object.defineProperty(window.Window.prototype, prop, {
                get: function() { return polyfill; },
                configurable: true
              });
            }
          } catch(e) {}
        }

        try {
          var testKey = "__cm_test__";
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
        } catch(e) {
          installStoragePolyfill("localStorage");
        }
        try {
          var testSession = "__cm_session_test__";
          window.sessionStorage.setItem(testSession, testSession);
          window.sessionStorage.removeItem(testSession);
        } catch(e) {
          installStoragePolyfill("sessionStorage");
        }

        function isDiscordEnv() {
          try {
            var hn = window.location.hostname || "";
            var qs = window.location.search || "";
            var sp = new URLSearchParams(qs);
            if (hn.indexOf("discordsays.com") !== -1 || hn.indexOf("discord.co") !== -1) {
              return true;
            }
            if (sp.has("frame_id") && sp.has("instance_id")) {
              return true;
            }
            if (sp.has("frame_id") || sp.has("instance_id")) {
              if (sp.has("channel_id") || sp.has("guild_id") || sp.get("platform") === "mobile" || sp.get("platform") === "desktop") {
                return true;
              }
            }
            if (sp.get("activity") === "discord" || sp.get("activity") === "mock") {
              return true;
            }
            return false;
          } catch(e) { return false; }
        }

        var inDiscord = isDiscordEnv();
        window.__IS_DISCORD_ACTIVITY__ = inDiscord;

        if (!inDiscord) {
          try {
            var pn = window.location.pathname || "";
            if (pn.indexOf("/.proxy") === 0) {
              var cleanPn = pn.replace(/^\/\.proxy\/?/, "/") || "/";
              window.location.replace(cleanPn + (window.location.search || "") + (window.location.hash || ""));
              return;
            }
          } catch(e) {}
        }

        if (inDiscord) {
          try {
            document.documentElement.classList.add("cm-discord-activity");

            // Persist parameters immediately in both storages
            var allParams = new URLSearchParams(window.location.search || "");
            if (window.location.hash && window.location.hash.indexOf("?") !== -1) {
              var hashQuery = window.location.hash.slice(window.location.hash.indexOf("?"));
              new URLSearchParams(hashQuery).forEach(function(val, key) {
                if (!allParams.has(key)) allParams.set(key, val);
              });
            }
            ["frame_id", "instance_id", "channel_id", "guild_id", "platform", "location_id", "mobile_app_version"].forEach(function(k) {
              var val = allParams.get(k);
              if (val) {
                try { localStorage.setItem("cm:discord:" + k, val); } catch(e) {}
                try { sessionStorage.setItem("cm:discord:" + k, val); } catch(e) {}
                try { localStorage.setItem("cm_discord_" + k, val); } catch(e) {}
                try { sessionStorage.setItem("cm_discord_" + k, val); } catch(e) {}
              }
            });

            function fixDiscordUrl(url) {
              if (typeof url !== "string") return url;
              try {
                var base = window.location.origin;
                var target = new URL(url, base);
                if (target.origin === base) {
                  var pathname = target.pathname;
                  if (!pathname.startsWith("/.proxy")) {
                    pathname = "/.proxy" + (pathname.startsWith("/") ? pathname : "/" + pathname);
                  }
                  target.pathname = pathname;
                  var currentParams = new URLSearchParams(window.location.search);
                  currentParams.forEach(function(val, key) {
                    if (!target.searchParams.has(key)) {
                      target.searchParams.set(key, val);
                    }
                  });
                  return target.pathname + target.search + target.hash;
                }
              } catch(e) {}
              return url;
            }

            var origReplace = window.location.replace;
            var origAssign = window.location.assign;
            window.location.replace = function(url) {
              return origReplace.call(window.location, fixDiscordUrl(url));
            };
            window.location.assign = function(url) {
              return origAssign.call(window.location, fixDiscordUrl(url));
            };

            if (window.history) {
              var origPush = window.history.pushState;
              var origRep = window.history.replaceState;
              if (origPush) {
                window.history.pushState = function(state, unused, url) {
                  return origPush.call(window.history, state, unused, url ? fixDiscordUrl(url) : url);
                };
              }
              if (origRep) {
                window.history.replaceState = function(state, unused, url) {
                  return origRep.call(window.history, state, unused, url ? fixDiscordUrl(url) : url);
                };
              }
            }
          } catch(e) {}

          if (window.location.pathname.indexOf('/.proxy') !== 0) {
            if (window.location.hostname.indexOf('discordsays.com') !== -1 || window.location.hostname.indexOf('discord.co') !== -1) {
              var target = '/.proxy/' + (window.location.search || '');
              if (window.location.hash) target += window.location.hash;
              window.location.replace(target);
              return;
            }
          }
        }

        var origFetch = window.fetch;
        if (origFetch) {
          window.fetch = function(input, init) {
            try {
              if (window.__IS_DISCORD_ACTIVITY__) {
                if (typeof input === 'string') {
                  if (input.charAt(0) === '/' && input.indexOf('/.proxy') !== 0) {
                    input = '/.proxy' + input;
                  }
                } else if (input && typeof input === 'object' && typeof input.url === 'string') {
                  if (input.url.charAt(0) === '/' && input.url.indexOf('/.proxy') !== 0) {
                    input = new Request('/.proxy' + input.url, input);
                  }
                }
              }
            } catch(e) {}
            return origFetch.call(this, input, init);
          };
        }

        var origXhrOpen = XMLHttpRequest.prototype.open;
        if (origXhrOpen) {
          XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
            try {
              if (window.__IS_DISCORD_ACTIVITY__ && typeof url === 'string') {
                if (url.charAt(0) === '/' && url.indexOf('/.proxy') !== 0) {
                  url = '/.proxy' + url;
                }
              }
            } catch(e) {}
            return origXhrOpen.call(this, method, url, async, user, password);
          };
        }
      })();
    </script>

    <script>
      (function () {
        // Global URL & Routing Architecture Service (Multi-game ready & Deep link support)
        window.URLService = {
          BASE_URL: 'https://clue-me.ai.studio',
          BASE_WEB_URL: 'https://clue-me.ai.studio',
          CUSTOM_SCHEME: 'clue-me',

          getMultiGameRoomUrl: function(roomId, gameId) {
            gameId = gameId || 'clue-me';
            return window.URLService.BASE_URL + '/' + gameId + '/room/' + String(roomId || '').toUpperCase();
          },

          getDirectRoomUrl: function(roomId) {
            return window.URLService.BASE_URL + '/room/' + String(roomId || '').toUpperCase();
          },

          getDownloadUrl: function() { 
            return window.URLService.BASE_URL + '/download'; 
          },

          getWebRoomUrl: function(roomId, gameId) {
            return window.URLService.getMultiGameRoomUrl(roomId, gameId);
          },

          getDeepRoomUrl: function(roomId, gameId) {
            gameId = gameId || 'clue-me';
            return (window.URLService.CUSTOM_SCHEME || 'clue-me') + '://' + gameId + '/room/' + String(roomId || '').toUpperCase();
          },

          parseCurrentRoute: function(customPath) {
            var path = typeof customPath === 'string' ? customPath : window.location.pathname;

            // A. Reserved Routes
            if (path === '/download' || path === '/download/') return { type: 'DOWNLOAD' };
            if (path.indexOf('/auth/') === 0) return { type: 'AUTH_CALLBACK' };
            if (path.indexOf('/.proxy/') === 0 || path === '/index.html') return { type: 'HOME' };

            // B. Multi-Game Room Pattern (Preserve URL)
            var multiMatch = path.match(/^\/([A-Za-z0-9_-]+)\/room\/([A-Za-z]{4})$/i);
            if (multiMatch) {
              return {
                type: 'ROOM',
                gameId: multiMatch[1].toLowerCase(),
                roomId: multiMatch[2].toUpperCase()
              };
            }

            // C. Legacy Direct Room Pattern
            var directMatch = path.match(/^\/room\/([A-Za-z]{4})$/i);
            if (directMatch) {
              return {
                type: 'ROOM',
                gameId: 'clue-me',
                roomId: directMatch[1].toUpperCase()
              };
            }

            // D. Root Path
            if (path === '/' || path === '') return { type: 'HOME' };

            // E. Truly Unknown / Invalid Routes
            return { type: 'UNKNOWN' };
          },

          parseDeepLink: function(url) {
            if (!url) return { type: 'UNKNOWN' };
            try {
              var rawUrl = String(url).trim();

              // 1. Download Custom Scheme
              if (/^(clue-me|clueme|intent):\/\/download(\/.*)?$/i.test(rawUrl)) {
                return { type: 'DOWNLOAD' };
              }

              // 2. Auth Custom Scheme: clue-me://auth or intent://auth
              if (/^(clue-me|clueme|intent):\/\/auth/i.test(rawUrl)) {
                return { type: 'AUTH_CALLBACK', url: rawUrl };
              }

              // 3. Multi-Game Room Custom Scheme: clue-me://:gameId/room/:roomId
              var schemeMultiMatch = rawUrl.match(/^(?:clue-me|clueme|intent):\/\/([A-Za-z0-9_-]+)\/room\/([A-Za-z]{4})(?:[/?#]|$)/i);
              if (schemeMultiMatch && schemeMultiMatch[1].toLowerCase() !== 'intent') {
                return {
                  type: 'ROOM',
                  gameId: schemeMultiMatch[1].toLowerCase(),
                  roomId: schemeMultiMatch[2].toUpperCase()
                };
              }

              // Legacy Room Custom Scheme: clue-me://room/:roomId or intent://room/:roomId
              var schemeLegacyMatch = rawUrl.match(/^(?:clue-me|clueme|intent):\/\/room\/([A-Za-z]{4})(?:[/?#]|$)/i);
              if (schemeLegacyMatch) {
                return {
                  type: 'ROOM',
                  gameId: 'clue-me',
                  roomId: schemeLegacyMatch[1].toUpperCase()
                };
              }

              // 4. Standard HTTP / HTTPS URL
              var normUrl = rawUrl.replace(/^(clue-me|clueme):\/\//i, 'https://clue-me.ai.studio/');
              var parsed = new URL(normUrl, window.location.origin);
              return window.URLService.parseCurrentRoute(parsed.pathname);
            } catch (e) {
              return { type: 'UNKNOWN' };
            }
          }
        };

        try {
          var isDiscord = false;
          try {
            var qs = new URLSearchParams(location.search);
            var isDiscordHost = Boolean(
              (window.name && window.name.indexOf('discord') !== -1) ||

            );

              var fidVal = qs.get('frame_id') || storedFid;

              ['frame_id', 'instance_id', 'platform', 'channel_id', 'guild_id'].forEach(function(k) {

            var finishAuth = function(token, user) {

              window.location.href = '/';

            // Exchange Discord access token for Clue Me user session

                  var avatarUrl = profile.avatar 
                    ? 'https://cdn.discordapp.com/avatars/' + profile.id + '/' + profile.avatar + '.png?size=128'
                    : 'https://cdn.discordapp.com/embed/avatars/' + defaultIndex + '.png';

                  return fetch('/api/auth/discord/implicit-callback', {

                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)

                }
                throw new Error('Invalid profile response');
              })
              .then(function(r) { return r.json(); })
              .then(function(data) {
                if (data && data.token) {
                  finishAuth(data.token, data.user);
                } else {
                  finishAuth(null, null);
                }
              })
              .catch(function(err) {
                console.error('[Discord OAuth] Profile exchange failed:', err);
                finishAuth(null, null);

              return;
            }

            // If no accessToken, return to home
            finishAuth(null, null);
            return;
          }

          // Handle discord_session redirect in external browser / web app
          var ses = qs.get('discord_session');

                try {

                } catch(e) {}

                try {

                setTimeout(function() { window.close(); }, 150);

          if (ses || isAuthDiscord) {

    <script>
      window.handleDiscordImplicitLogin = function() {
        console.log("[Discord Auth] Initiating pure Client-Side Discord Implicit OAuth Flow...");
        
        // Clear any previous error banner
        const existingBanner = document.getElementById('cm-auth-error-banner');
        if (existingBanner) existingBanner.remove();

        // 1. Fetch Discord Client Configuration
        fetch("/api/auth/discord/config")
          .then(function(res) { return res.json(); })
          .then(function(config) {
            var clientId = config.clientId;
            if (!clientId) {
              console.error("[Discord Auth] Discord Client ID is not configured on the server!");
              showAuthError("خطأ: لم يتم ضبط معرف تطبيق Discord (Client ID) على خادم اللعبة بعد.");
              return;
            }

            // 2. Explicit Redirect URI as configured on Discord Developer Portal
            var redirectUri = 'https://clue-me.ai.studio/auth/callback';

            // 3. Build OAuth URL
            var oauthUrl = 'https://discord.com/api/oauth2/authorize' +
              '?client_id=' + encodeURIComponent(clientId) +
              '&redirect_uri=' + encodeURIComponent(redirectUri) +
              '&response_type=token' +
              '&scope=identify%20email';

            console.log("[Discord Auth] Opening browser popup to Discord OAuth...", oauthUrl);

            // 4. Trigger Browser or Popup
            var isNativeApp = Boolean(
              (document.documentElement && document.documentElement.classList.contains("cm-native-app")) ||
              (window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform()) ||
              typeof window.Capacitor !== "undefined"
            );

            if (isNativeApp && typeof window.safeOpenExternal === "function") {
              window.safeOpenExternal(oauthUrl);
              return;
            }

            var width = 600;
            var height = 750;
            var left = (window.screen.width - width) / 2;
            var top = (window.screen.height - height) / 2;
            var popup = window.open(oauthUrl, "discord_login", "width=" + width + ",height=" + height + ",left=" + left + ",top=" + top);
            
            if (!popup || popup.closed || typeof popup.closed == "undefined") {
              // Popup blocked - redirect the parent window directly as fallback
              window.location.href = oauthUrl;
              return;
            }

            var pollInterval = setInterval(function() {
              if (localStorage.getItem('clue-me:token')) {
                clearInterval(pollInterval);
                window.location.reload();
                return;
              }
              if (popup.closed) {
                clearInterval(pollInterval);
                setTimeout(function() {
                  if (localStorage.getItem('clue-me:token')) {
                    window.location.reload();
                  }
                }, 300);
              }
            }, 500);
          })
          .catch(function(err) {
            console.error("[Discord Auth] Failed to fetch config:", err);
            showAuthError("تعذر الاتصال بالخادم لجلب إعدادات Discord.");
          });
      };

      window.handleNativeDiscordLogin = function() {
        if (typeof window.handleDiscordImplicitLogin === "function") {
          window.handleDiscordImplicitLogin();
        }
      };

      // Compatibility alias for the prebuilt index-discord-v30.js client asset
      window.handleFirebaseDiscordLogin = function() {
        if (typeof window.handleDiscordImplicitLogin === "function") {
          window.handleDiscordImplicitLogin();
        }
      };

      // Listen for message from the popup
      window.addEventListener("message", function(event) {
        if (event.data && event.data.type === "DISCORD_AUTH_COMPLETE") {
          console.log("[Main Window] Received auth notification from popup!", event.data);
          var token = event.data.token || event.data.session;
          if (token) {
            try {
              localStorage.setItem('clue-me:token', token);
              localStorage.setItem('discord_session', token);
              if (event.data.user && event.data.user.name) {
                localStorage.setItem('clue-me:name', event.data.user.name);
              }
            } catch(e) {}
          }
          window.location.reload();
        }
      });

      function showAuthError(message, isInfo) {
        // Clear previous error banner
        const existingBanner = document.getElementById('cm-auth-error-banner');
        if (existingBanner) existingBanner.remove();

        var banner = document.createElement('div');

        var bgColor = '#1e1b4b';
        var borderColor = isInfo ? '#4f46e5' : '#ef4444';
        var titleColor = isInfo ? '#818cf8' : '#f87171';
        var titleText = isInfo ? 'ℹ️ جاري تسجيل الدخول...' : '⚠️ تنبيه تسجيل الدخول';

        banner.style.cssText = 'position:fixed;bottom:24px;left:24px;right:24px;max-width:500px;margin:0 auto;z-index:999999;background:' + bgColor + ';color:#fef2f2;padding:20px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,0.6);border:2px solid ' + borderColor + ';font-family:sans-serif;direction:rtl;display:flex;flex-direction:column;gap:12px;';
        
        banner.innerHTML = 
          '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid ' + (isInfo ? 'rgba(79,70,229,0.3)' : 'rgba(239,68,68,0.3)') + ';padding-bottom:8px;">' +
            '<div style="font-weight:bold;font-size:16px;color:' + titleColor + ';display:flex;align-items:center;gap:6px;">' + titleText + '</div>' +
            '<button onclick="this.parentElement.parentElement.remove()" style="background:none;border:none;color:#9ca3af;font-size:24px;cursor:pointer;line-height:1;padding:0 4px;margin:0;">&times;</button>' +
          '</div>' +
          '<div style="font-size:14px;line-height:1.6;color:#e5e7eb;opacity:0.95;">' + message + '</div>' +
          (!isInfo ? 
          '<div style="display:flex;justify-content:end;gap:8px;margin-top:4px;">' +
            '<button onclick="this.parentElement.parentElement.remove()" style="background:#dc2626;color:#ffffff;border:none;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 3px 10px rgba(220,38,38,0.4);transition:all 0.2s;">موافق</button>' +
          '</div>' : '');
          
        document.body.appendChild(banner);
        
        // Auto-remove after 10 seconds
        setTimeout(function() {
          if (banner && banner.parentElement) {
            banner.remove();
          }
        }, 10000);
      }
