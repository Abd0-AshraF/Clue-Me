        --cm-safe-top: var(--discord-safe-area-inset-top, env(safe-area-inset-top, 0px));
        --cm-safe-bottom: var(--discord-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        --cm-safe-left: var(--discord-safe-area-inset-left, env(safe-area-inset-left, 0px));

    <!-- Apply stored language/direction/theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var qs = new URLSearchParams(location.search);
          if (qs.has('frame_id') || qs.has('instance_id') || qs.get('activity') === 'mock') {
            document.documentElement.classList.add('cm-discord-activity');
          }
          var lang = localStorage.getItem('ui_lang') || localStorage.getItem('clue-me:lang');
          if (lang !== 'ar' && lang !== 'en') lang = 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          var theme = localStorage.getItem('clue-me:theme') || 'mot';
          var dark =
            theme === 'dark' ||
            theme === 'mani-dark' ||
            theme === 'mot' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var mani = theme === 'mani' || theme === 'mani-dark';
          var mot = theme === 'mot';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('mani', mani);
          document.documentElement.classList.toggle('mani-dark', theme === 'mani-dark');
          document.documentElement.classList.toggle('mot', mot);

          // Handle discord_session redirect in external browser / web app
          var ses = qs.get('discord_session');
          var isAuthDiscord = qs.get('auth') === 'discord' || qs.has('discord_session');
          if (ses || isAuthDiscord) {
            if (ses) {
              try {
                localStorage.setItem('discord_session', ses);
                localStorage.setItem('clue-me:discord_session', ses);
                localStorage.setItem('clue-me:pending_discord_session', ses);
              } catch(e) {}

              fetch('/api/auth/discord/exchange', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session: ses })
              })
              .then(function(r) { return r.json(); })
              .then(function(data) {
                if (data && data.token) {
                  try {
                    localStorage.setItem('clue-me:token', data.token);
                    if (data.user && data.user.name) {
                      localStorage.setItem('clue-me:name', data.user.name);
                    }
                  } catch(e) {}
                  window.dispatchEvent(new CustomEvent('cm:auth-changed', { detail: data }));
                }
              })
              .catch(function(){});

              // Clean URL
              var cleanUrl = window.location.pathname + (window.location.hash || '');
              window.history.replaceState({}, document.title, cleanUrl);

              var appDeepLink = 'clue-me://auth?discord_session=' + encodeURIComponent(ses);
              var intentLink = 'intent://auth?discord_session=' + encodeURIComponent(ses) + '#Intent;scheme=clue-me;package=com.clueme.app;S.browser_fallback_url=' + encodeURIComponent(window.location.href) + ';end';

              var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
              var isNative = Boolean(
                window.Capacitor ||
                window.cordova ||
                location.protocol === 'capacitor:' ||
                document.documentElement.classList.contains('cm-native-app')
              );

              if (isMobile && !isNative) {
                try {
                  window.location.href = appDeepLink;
                } catch(e) {}

                function showReturnToAppUI() {
                  if (document.getElementById('cm-return-app-banner')) return;
                  var banner = document.createElement('div');
                  banner.id = 'cm-return-app-banner';
                  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#1e1b4b;color:#ffffff;padding:20px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,0.6);border-bottom:4px solid #6366f1;font-family:sans-serif;direction:rtl;';
                  banner.innerHTML =
                    '<div style="font-weight:bold;font-size:18px;margin-bottom:8px;">تم تسجيل الدخول بنجاح! 🎉</div>' +
                    '<div style="font-size:14px;opacity:0.9;margin-bottom:16px;">اضغط على الزر أدناه للعودة إلى التطبيق ومتابعة اللعب:</div>' +
                    '<a href="' + appDeepLink + '" style="display:inline-block;background:#4f46e5;color:#ffffff;padding:12px 28px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:16px;box-shadow:0 3px 10px rgba(79,70,229,0.5);margin:4px;">اضغط هنا للعودة للتطبيق 📱</a>';
                  if (document.body) document.body.appendChild(banner);
                }

                if (document.readyState === 'interactive' || document.readyState === 'complete') {
                  showReturnToAppUI();
                } else {
                  document.addEventListener('DOMContentLoaded', showReturnToAppUI);
                }
              }
            } else {
              var cleanUrl = window.location.pathname + (window.location.hash || '');
              window.history.replaceState({}, document.title, cleanUrl);
            }
          }
        } catch (e) {
          /* storage unavailable — keep static defaults */
        }
      })();
    </script>
    
    <!-- CLUE ME NATIVE APP AUTO-CONNECT BRIDGE -->
    <script>
      (function() {
        // Detect native Capacitor or standalone WebView environment
        function checkNative() {
          return Boolean(
            location.protocol === "capacitor:" || 
            location.protocol === "ionic:" || 
            (location.hostname === "localhost" && (!location.port || location.port === "80" || location.port === "443")) ||
            (location.hostname === "127.0.0.1" && (!location.port || location.port === "80" || location.port === "443")) ||
            (navigator.userAgent && (navigator.userAgent.indexOf("Capacitor") !== -1 || (navigator.userAgent.indexOf("Android") !== -1 && (navigator.userAgent.indexOf("; wv") !== -1 || navigator.userAgent.indexOf("Version/") !== -1)))) ||
            (typeof window.Capacitor !== "undefined" && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform()) ||
            (typeof window.Capacitor !== "undefined")
          );
        }

        var isCapacitorNative = checkNative();
        if (isCapacitorNative) {
          document.documentElement.classList.add("cm-native-app");
        }
        
        var customServer = "";
        try { 
          if (isCapacitorNative) {
            customServer = localStorage.getItem("clue_me_custom_server") || ""; 
          }
        } catch(e){}
        
        var targetServer = "";
        if (isCapacitorNative) {
          targetServer = (customServer || "https://clue-me.ai.studio").replace(/\/$/, "");
        }
        window.__CLUE_ME_SERVER_URL__ = targetServer;

        var isDev = true; // Enable explicit request logging in development / diagnostic mode
        try {
          isDev = Boolean(
            location.hostname === "localhost" || 
            location.hostname === "127.0.0.1" || 
            location.search.indexOf("debug=1") !== -1 || 
            localStorage.getItem("clue_me_debug") === "true" ||
            isCapacitorNative
          );
        } catch(e) {}

        function rewriteUrl(u) {
          if (!targetServer || !isCapacitorNative || typeof u !== "string") return u;
          if (u.indexOf("http://") === 0 || u.indexOf("https://") === 0) return u;
          var p = u.indexOf("/") === 0 ? u : ("/" + u);
          if (p.indexOf("/api/") === 0 || p.indexOf("/socket.io") === 0 || p === "/api/health" || p.indexOf("/api") === 0) {
            var rewritten = targetServer + p;
            if (isDev) {
              console.log("[ClueMe URL Interceptor] [API Request Rewrite] Original:", u, "-> Rewritten:", rewritten);
            }
            return rewritten;
          }
          if (isDev && (p.indexOf("/room/") !== -1 || p.indexOf("auth") !== -1)) {
            console.log("[ClueMe URL Interceptor] [Route Pass-through] URL:", u);
          }
          return u;
        }

        if (targetServer && isCapacitorNative) {
          var origAssign = window.location.assign;
          window.location.assign = function(url) {
            if (isDev) {
              console.log("[ClueMe URL Interceptor] location.assign called with:", url);
            }
            if (typeof url === "string" && (url.indexOf("/api/") === 0 || url.indexOf("auth/discord") !== -1 || url.indexOf("/room/") === 0)) {
              url = rewriteUrl(url);
            }
            return origAssign.call(this, url);
          };

          var origReplace = window.location.replace;
          window.location.replace = function(url) {
            if (isDev) {
              console.log("[ClueMe URL Interceptor] location.replace called with:", url);
            }
            if (typeof url === "string" && (url.indexOf("/api/") === 0 || url.indexOf("auth/discord") !== -1 || url.indexOf("/room/") === 0)) {
              url = rewriteUrl(url);
            }
            return origReplace.call(this, url);
          };

          var origFetch = window.fetch;
          window.fetch = function(input, init) {
            var reqUrl = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
            if (isDev && (reqUrl.indexOf("/api/") !== -1 || reqUrl.indexOf("auth") !== -1)) {
              console.log("[ClueMe URL Interceptor] fetch request intercepted:", reqUrl, init);
            }
            if (typeof input === "string") {
              input = rewriteUrl(input);
            } else if (input && typeof input.url === "string") {
              var rewritten = rewriteUrl(input.url);
              if (rewritten !== input.url) {
                input = new Request(rewritten, input);
              }
            }
            return origFetch.call(this, input, init);
          };

          var origOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
            if (isDev && url && (String(url).indexOf("/api/") !== -1 || String(url).indexOf("auth") !== -1)) {
              console.log("[ClueMe URL Interceptor] XHR open intercepted:", method, url);
            }
            url = rewriteUrl(url);
            return origOpen.call(this, method, url, async !== false, user, password);
          };
        }

        // Safe External Browser Launcher for Discord OAuth & External Links
        function safeOpenExternal(url) {
          if (!url) return;
          if (url.indexOf("/") === 0 && url.indexOf("//") !== 0) {
            url = ((window.__CLUE_ME_SERVER_URL__ || window.location.origin) + url);
          }
          try {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
              window.Capacitor.Plugins.Browser.open({ url: url }).catch(function() {
                window.open(url, "_system");
              });
            } else if (window.cordova && window.cordova.InAppBrowser) {
              window.cordova.InAppBrowser.open(url, "_system", "location=yes");
            } else if (window.discordSdk && window.discordSdk.commands && window.discordSdk.commands.openExternalLink) {
              window.discordSdk.commands.openExternalLink({ url: url }).catch(function(){});
            } else {
              window.open(url, "_system") || (window.location.href = url);
            }
          } catch(e) {
            window.location.href = url;
          }
        }
        window.safeOpenExternal = safeOpenExternal;

        function handleDiscordCallback(url) {
          if (!url) return;
          try {
            var rawUrl = String(url);
            var normUrl = rawUrl.replace(/^(clue-me|clueme):\/\//i, "https://clueme.wisp.uno/");
            var parsed = new URL(normUrl);
            var searchParams = new URLSearchParams(parsed.search || "");
            var hashParams = new URLSearchParams((parsed.hash || "").replace(/^#/, ""));
            var code = searchParams.get("code");
            var ses = searchParams.get("discord_session") || hashParams.get("access_token");

            var payload = {};
            if (code) {
              payload = { code: code, redirectUri: "clue-me://auth" };
            } else if (ses) {
              payload = { session: ses };
              try {
                localStorage.setItem("discord_session", ses);
                localStorage.setItem("clue-me:discord_session", ses);
                localStorage.setItem("clue-me:pending_discord_session", ses);
              } catch(e) {}
            }

            if (code || ses) {
              fetch("/api/auth/discord/exchange", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
              })
              .then(function(res) { return res.json(); })
              .then(function(data) {
                if (data && data.token) {
                  try {
                    localStorage.setItem("clue-me:token", data.token);
                    localStorage.setItem("discord_session", data.token);
                    if (data.user && data.user.name) {
                      localStorage.setItem("clue-me:name", data.user.name);
                    }
                  } catch(e) {}
                  window.dispatchEvent(new CustomEvent("cm:auth-changed", { detail: data }));
                }
              })
              .catch(function(){});
            }
          } catch(e) {}
        }
        window.handleDiscordCallback = handleDiscordCallback;

        // Initialize Native Device Features (Status Bar & Haptics & Deep Links)
        function handleDeepLink(url) {
          if (!url) return;
          try {
            var rawUrl = String(url);
            var normUrl = rawUrl.replace(/^(clue-me|clueme):\/\//i, "https://clueme.wisp.uno/");
            var parsed = new URL(normUrl);
            var searchParams = new URLSearchParams(parsed.search || "");
            var hashParams = new URLSearchParams((parsed.hash || "").replace(/^#/, ""));

            // Check if URL contains Discord OAuth parameters or session or clue-me://auth
            var isDiscordOAuth =
              searchParams.has("code") ||
              searchParams.has("access_token") ||
              hashParams.has("access_token") ||
              searchParams.has("state") ||
              searchParams.has("discord_session") ||
              searchParams.get("auth") === "discord" ||
              rawUrl.indexOf("clue-me://auth") !== -1 ||
              rawUrl.indexOf("clueme://auth") !== -1 ||
              rawUrl.indexOf("auth/discord") !== -1;

            if (isDiscordOAuth) {
              window.handleDiscordCallback(rawUrl);
              var cleanUrl = "/";
              window.history.replaceState({}, document.title, cleanUrl);
              window.dispatchEvent(new PopStateEvent("popstate"));
              // RETURN EARLY / STOP EXECUTING so it does NOT try to look up a room code!
              return;
            }

            // ELSE IF room parameters exist (e.g. room or roomId or /room/ path):
            var roomCode = searchParams.get("room") || searchParams.get("roomId");
            var pathname = parsed.pathname || "/";
            if (roomCode || pathname.indexOf("/room/") === 0) {
              var targetPath = pathname + (parsed.search || "") + (parsed.hash || "");
              window.history.pushState({}, "", targetPath);
              window.dispatchEvent(new PopStateEvent("popstate"));
              return;
            }

            var targetPath = pathname + (parsed.search || "") + (parsed.hash || "");
            if (targetPath && targetPath !== "/" && targetPath !== location.pathname + location.search) {
              window.history.pushState({}, "", targetPath);
              window.dispatchEvent(new PopStateEvent("popstate"));
            }
          } catch(e) {}
        }

        document.addEventListener("DOMContentLoaded", function() {
          try {
            if (checkNative()) {
              document.documentElement.classList.add("cm-native-app");
            }
            if (window.Capacitor && window.Capacitor.Plugins) {
              var StatusBar = window.Capacitor.Plugins.StatusBar;
              if (StatusBar) {
                StatusBar.setOverlaysWebView({ overlay: false }).catch(function(){});
                StatusBar.setStyle({ style: "DARK" }).catch(function(){});
                StatusBar.setBackgroundColor({ color: "#17131a" }).catch(function(){});
              }
              var App = window.Capacitor.Plugins.App;
              if (App) {
                App.addListener("appUrlOpen", function(event) {
                  if (event && event.url) {
                    handleDeepLink(event.url);
                  }
                });
                App.getLaunchUrl().then(function(res) {
                  if (res && res.url) {
                    handleDeepLink(res.url);
                  }
                }).catch(function(){});
              }
            }
          } catch(e) {}
        });

        // Global Tactile Haptic Feedback for Native App
        window.cmTriggerHaptic = function(style) {
          try {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) {
              var Haptics = window.Capacitor.Plugins.Haptics;
              if (style === "heavy") Haptics.impact({ style: "HEAVY" });
              else if (style === "medium") Haptics.impact({ style: "MEDIUM" });
              else if (style === "success") Haptics.notification({ type: "SUCCESS" });
              else if (style === "warning") Haptics.notification({ type: "WARNING" });
              else Haptics.impact({ style: "LIGHT" });
            }
          } catch(e) {}
        };

        // Intercept link clicks in Discord activity
        (function() {
          var isDiscord = document.documentElement.classList.contains("cm-discord-activity") ||
                          location.search.indexOf("frame_id") !== -1 ||
                          location.search.indexOf("instance_id") !== -1 ||
                          location.search.indexOf("activity=mock") !== -1;

          if (isDiscord) {
            document.documentElement.classList.add("cm-discord-activity");

            var safeOpenExternal = function(url) {
              if (!url) return;
              if (window.discordSdk && window.discordSdk.commands && window.discordSdk.commands.openExternalLink) {
                window.discordSdk.commands.openExternalLink({ url: url }).catch(function(){});
              }
            };

            try {
              window.open = function(url) {
                if (url && (url.indexOf("http://") === 0 || url.indexOf("https://") === 0)) {
                  safeOpenExternal(url);
                }
                return null;
              };
            } catch(e) {}

            document.addEventListener("click", function(e) {
              var anchor = e.target && e.target.closest ? e.target.closest("a") : null;
              if (anchor) {
                var href = anchor.getAttribute("href");
                if (!href || href === "#" || href.indexOf("javascript:") === 0) {
                  e.preventDefault();
                  e.stopPropagation();
                  return;
                }
                if (href.indexOf("http://") === 0 || href.indexOf("https://") === 0) {
                  e.preventDefault();
                  e.stopPropagation();
                  safeOpenExternal(href);
                  return;
                }
                if (href.indexOf("/") === 0) {
                  if (href.indexOf("/api/") === 0) {
                    if (typeof isCapacitorNative !== "undefined" && isCapacitorNative) {
                      e.preventDefault();
                      e.stopPropagation();
                      var fullUrl = ((window.__CLUE_ME_SERVER_URL__ || "") + href);
                      if (href.indexOf("auth/discord") !== -1) {
                        safeOpenExternal(fullUrl);
                      } else {
                        window.location.assign(fullUrl);
                      }
                    }
                    return;
                  }
                  e.preventDefault();
                  e.stopPropagation();
                  window.history.pushState({}, "", href);
                  window.dispatchEvent(new PopStateEvent("popstate"));
                  return;
                }
              }
            }, true);
          } else {
            document.addEventListener("click", function(e) {
              var anchor = e.target && e.target.closest ? e.target.closest("a") : null;
              if (anchor) {
                var href = anchor.getAttribute("href");
                if (!href || href === "#" || href.indexOf("javascript:") === 0) {
                  e.preventDefault();
                }
              }
            }, true);
          }
        })();

        // Attach subtle touch feedback to buttons and interactive elements
        document.addEventListener("click", function(e) {
          var target = e.target && e.target.closest ? e.target.closest("button, a, [role=\"button\"], .cm-card") : null;
          if (target) {
