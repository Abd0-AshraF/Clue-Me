    <!-- Apply stored language/direction/theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var qs = new URLSearchParams(location.search);
          if (qs.has('frame_id') || qs.has('instance_id') || qs.get('activity') === 'mock') {
            document.documentElement.classList.add('cm-discord-activity');
          }
          var lang = localStorage.getItem('clue-me:lang');
          if (lang !== 'ar' && lang !== 'en') lang = 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          var theme = localStorage.getItem('clue-me:theme') || 'mot';
          var dark =
            theme === 'dark' ||
            theme === 'mani-dark' ||
            theme === 'mot' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var mani = theme === 'mani' || theme === 'mani-dark';
          var mot = theme === 'mot';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('mani', mani);
          document.documentElement.classList.toggle('mani-dark', theme === 'mani-dark');
          document.documentElement.classList.toggle('mot', mot);
        } catch (e) {
          /* storage unavailable — keep static defaults */
        }
      })();
    </script>
    
    <!-- CLUE ME NATIVE APP AUTO-CONNECT BRIDGE -->
    <script>
      (function() {
        // Automatically route API and WebSocket traffic to production cloud server when running inside Android/iOS App
        var PROD_SERVER = "https://clue-me.ai.studio";
        var isNativeApp = window.Capacitor !== undefined || 
                          location.protocol === "capacitor:" || 
                          location.hostname === "localhost" ||
                          location.hostname === "127.0.0.1";
        
        var customServer = "";
        try { customServer = localStorage.getItem("clue_me_custom_server") || ""; } catch(e){}
        
        var targetServer = (customServer || (isNativeApp ? PROD_SERVER : "")).replace(/\/$/, "");
        window.__CLUE_ME_SERVER_URL__ = targetServer;

        window.cmConfigureServerUrl = function() {
          var current = localStorage.getItem("clue_me_custom_server") || targetServer || "";
          var input = prompt(
            "أدخل رابط السيرفر للاتصال بالتطبيق أونلاين (Server URL):\n\nمثال سيرفر خارجي:\nhttps://your-server.onrender.com\n\nأو تجربة محلية Wi-Fi:\nhttp://192.168.1.100:3000",
            current
          );
          if (input !== null) {
            input = input.trim().replace(/\/$/, "");
            if (input) {
              localStorage.setItem("clue_me_custom_server", input);
            } else {
              localStorage.removeItem("clue_me_custom_server");
            }
            alert("تم حفظ عنوان السيرفر. جاري إعادة تحميل التطبيق...");
            location.reload();
          }
        };

        if (targetServer) {
          // Intercept fetch calls starting with /api/ or relative endpoints
          var origFetch = window.fetch;
          window.fetch = function(input, init) {
            if (typeof input === "string") {
              if (input.startsWith("/api/")) {
                input = targetServer + input;
              } else if (input.startsWith("/")) {
                // If it asks for root /api or relative endpoints
                if (input.indexOf("/api") === 0 || input.indexOf("/socket.io") === 0) {
                  input = targetServer + input;
                }
              }
            } else if (input && typeof input.url === "string") {
              if (input.url.startsWith("/api/")) {
                input = new Request(targetServer + input.url, input);
              }
            }
            return origFetch.call(this, input, init);
          };
        }

        // Initialize Native Device Features (Status Bar & Haptics)
        document.addEventListener("DOMContentLoaded", function() {
          try {
            if (window.Capacitor && window.Capacitor.Plugins) {
              var StatusBar = window.Capacitor.Plugins.StatusBar;
              if (StatusBar) {
                StatusBar.setOverlaysWebView({ overlay: false }).catch(function(){});
                StatusBar.setStyle({ style: "DARK" }).catch(function(){});
                StatusBar.setBackgroundColor({ color: "#17131a" }).catch(function(){});
              }
            }
          } catch(e) {}
        });

        // Global Tactile Haptic Feedback for Native App
        window.cmTriggerHaptic = function(style) {
          try {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) {
              var Haptics = window.Capacitor.Plugins.Haptics;
              if (style === "heavy") Haptics.impact({ style: "HEAVY" });
              else if (style === "medium") Haptics.impact({ style: "MEDIUM" });
              else if (style === "success") Haptics.notification({ type: "SUCCESS" });
              else if (style === "warning") Haptics.notification({ type: "WARNING" });
              else Haptics.impact({ style: "LIGHT" });
            }
          } catch(e) {}
        };

        // Attach subtle touch feedback to buttons and interactive elements
        document.addEventListener("click", function(e) {
          var target = e.target && e.target.closest ? e.target.closest("button, a, [role=\"button\"], .cm-card") : null;
          if (target) {
            window.cmTriggerHaptic("light");
          }
        }, { passive: true });
      })();
    </script>
