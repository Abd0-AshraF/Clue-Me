name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Generate Production Android Launcher Icons
        run: |
          node scripts/generate-android-icons.cjs

      - name: Auto-Generate Production Keystore
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'my-game-key' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'clueme123456' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'clueme123456' }}
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/my-release-key.jks" ]; then
            echo "Generating production Java Keystore (my-release-key.jks)..."
            keytool -genkeypair -v \
              -keystore android/app/my-release-key.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=ClueMe Game, OU=Mobile, O=ClueMe, L=Cairo, ST=Cairo, C=EG"
          fi

      - name: Grant execute permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'my-game-key' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'clueme123456' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'clueme123456' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ClueMe-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30


